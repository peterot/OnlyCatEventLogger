onlycat:
  gatewayUrl: https://gateway.onlycat.com
  token: "${ONLYCAT_TOKEN:replace-with-token}"
  requestDeviceListEvent: getDevices
  namespace: "/"
  subscribeEvents: []
  platform: "onlycat-java"
  device: "onlycat-event-logger"
  backfill:
    enabled: false
    limit: 500
    checkpointPath: "onlycat-checkpoint.json"

# Output destination: 'sheets' (default) sends events to Google Sheets,
# 'file' writes a local CSV instead (no Google credentials required).
output:
  mode: sheets
  file:
    path: onlycat-events.csv         # full record, all columns
    llmPath: onlycat-events-llm.csv  # optimised for LLM consumption
    timezone: Europe/London          # used for event_time_local column in LLM file

sheets:
  credentialsPath: "/path/to/service-account.json"
  spreadsheetId: "your-sheet-id"
  sheetName: "OnlyCatEvents"
  appendRange: "OnlyCatEvents!A1"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.onlycat.ingest: DEBUG

spring:
  config:
    import: "classpath:cat-label-mapping.yml"
